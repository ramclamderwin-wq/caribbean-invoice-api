services:
  - type: web
    name: invosentry-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: invosentry-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/invoice_api.db
      - key: API_ADMIN_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        value: price_1UfA89KqMzLsvG4ZAFDh3MJU
      - key: STRIPE_PRICE_PROFESSIONAL
        value: price_1UfA8MKqMzLsvG4Zhn16WocE
      - key: STRIPE_PRICE_BUSINESS
        value: price_1UfA8OKqMzLsvG4ZAM90zuJE
      - key: CHECKOUT_SUCCESS_URL
        sync: false
      - key: CHECKOUT_CANCEL_URL
        sync: false
      - key: CUSTOMER_PORTAL_RETURN_URL
        sync: false
      - key: PLAN_STARTER_MONTHLY_LIMIT
        value: "1000"
      - key: PLAN_PROFESSIONAL_MONTHLY_LIMIT
        value: "5000"
      - key: PLAN_BUSINESS_MONTHLY_LIMIT
        value: "20000"
