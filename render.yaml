services:
  - type: web
    name: invoice-intelligence-api
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: invoice-api-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/invoice_api.db
      - key: API_ADMIN_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_PROFESSIONAL
        sync: false
      - key: STRIPE_PRICE_BUSINESS
        sync: false
      - key: CHECKOUT_SUCCESS_URL
        sync: false
      - key: CHECKOUT_CANCEL_URL
        sync: false
      - key: CUSTOMER_PORTAL_RETURN_URL
        sync: false
      - key: PLAN_STARTER_MONTHLY_LIMIT
        value: "1000"
      - key: PLAN_PROFESSIONAL_MONTHLY_LIMIT
        value: "5000"
      - key: PLAN_BUSINESS_MONTHLY_LIMIT
        value: "20000"
