name: Tests

on:
  push:
    branches: [main, "improve/**", "test/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Tesseract OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng tesseract-ocr-spa
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Build production Docker image
        run: docker build -t invoice-api-ci .
      - name: Smoke-test the production Docker image
        run: |
          docker run -d --name invoice-api-smoke -p 8000:8000 -e DATABASE_PATH=/var/data/invoice_api.db --tmpfs /var/data:uid=10001,gid=10001 invoice-api-ci
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request
          import subprocess

          healthy = False
          for attempt in range(30):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=2) as response:
                      if response.status == 200:
                          print(response.read().decode())
                          healthy = True
                          break
              except (urllib.error.URLError, TimeoutError, OSError):
                  time.sleep(1)
          if not healthy:
              subprocess.run(["docker", "logs", "invoice-api-smoke"], check=False)
              raise SystemExit("Container health smoke test failed")
          PY
          docker logs invoice-api-smoke
          docker rm -f invoice-api-smoke
      - name: Run tests
        run: PYTHONPATH=. pytest -q
