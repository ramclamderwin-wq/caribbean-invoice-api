<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate Invoice Intelligence API</title><style>body{font:16px system-ui,sans-serif;max-width:680px;margin:10vh auto;padding:24px;color:#172033}pre{overflow-wrap:anywhere;background:#f2f4f8;padding:14px;border-radius:8px}button{padding:12px 18px;border:0;border-radius:8px;background:#2457d6;color:white}#key{display:none}</style></head><body><h1>Activate your API account</h1><p id="status">Verifying your Stripe payment…</p><section id="key"><h2>Your API key</h2><p><b>Copy and save it now. It is displayed only once.</b></p><pre id="value"></pre><button id="copy">Copy API key</button><p>Keep this key private. <a href="/docs">Open API documentation</a>.</p></section><script>(async()=>{const s=document.getElementById('status'),id=new URLSearchParams(location.search).get('session_id');if(!id){s.textContent='Missing Stripe Checkout session.';return;}try{const r=await fetch('/v1/billing/claim',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:id})}),d=await r.json();if(!r.ok)throw Error(d.detail||'Activation failed');document.getElementById('value').textContent=d.api_key;document.getElementById('key').style.display='block';s.textContent='Payment confirmed. Your API access is active.';document.getElementById('copy').onclick=async()=>{await navigator.clipboard.writeText(d.api_key);document.getElementById('copy').textContent='Copied';};}catch(e){s.textContent=e.message;}})();</script></body></html>
